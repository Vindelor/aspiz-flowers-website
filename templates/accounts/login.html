{% extends "base.html" %}
{% block title %}Giriş Yap - Çiçek Deposu{% endblock %}

{% block content %}
  <div class="auth-page">
    <span class="page-kicker" style="display: block; text-align: center;">Aspiz Flowers</span>
    <h1 class="page-title" style="text-align: center;">Giriş Yap</h1>
    <div class="page-rule" style="margin-inline: auto;"></div>

    <div class="account-card">
      {% if otp_sent %}
      <form method="post" action="{% url 'accounts:login_verify' %}" class="account-form">
        {% csrf_token %}
        <div class="form-group">
          <label for="loginCode">WhatsApp'a gönderilen 6 haneli kod</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-shield-halved field-icon"></i>
            <input id="loginCode" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
          </div>
        </div>
        <button type="submit" class="login-btn">
          <span class="btn-label">Giriş Yap</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
        <p class="auth-note" style="text-align: center; margin-top: 1rem;">
          <a href="{% url 'accounts:login' %}">Numarayı değiştir veya kodu yeniden iste</a>
        </p>
      </form>
      {% else %}
      <form method="post" action="{% url 'accounts:login' %}" class="account-form">
        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next|default:'' }}">


        <div class="form-group">
          <label for="loginPhone">Telefon Numarası</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-phone field-icon"></i>
            <input id="loginPhone" type="tel" name="phone" placeholder="+90 5XX XXX XX XX" autocomplete="tel" required>
          </div>
        </div>

        <button type="submit" class="login-btn">
          <span class="btn-label">Kod Gönder</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
      {% endif %}
    </div>

    <p class="auth-note">
      Hesabınız yok mu? <a href="{% url 'accounts:register' %}">Kayıt olun</a><br>
    </p>
  </div>
{% endblock %}
